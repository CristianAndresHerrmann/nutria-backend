name: nutria

services:
  proxy:
    # v3.1 no ve los contenedores con Docker Engine 29+ (la VM de staging): rechaza
    # la versión de API que usaba ese Traefik y todo responde 404.
    image: traefik:v3.7
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    build:
      context: ../nutria-frontend
    env_file:
      - ../nutria-frontend/.env
    environment:
      # El watcher vive en Vite, también al iniciar desde Docker Desktop.
      # Windows/OneDrive no siempre propagan eventos del filesystem al contenedor.
      WATCH_POLLING: "true"
    volumes:
      # Solo código/configuración: node_modules conserva las dependencias Linux
      # de la imagen y los builds siguen escribiendo dentro del contenedor.
      - type: bind
        source: ../nutria-frontend/src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../nutria-frontend/public
        target: /app/public
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../nutria-frontend/index.html
        target: /app/index.html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../nutria-frontend/vite.config.js
        target: /app/vite.config.js
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`local.nutria.com`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    # Opcional con `npm run dev`: reconstruye al cambiar dependencias.
    # El hot reload del código ya funciona sin Compose Watch por los mounts.
    develop:
      watch:
        - action: rebuild
          path: ../nutria-frontend/package.json
        - action: rebuild
          path: ../nutria-frontend/package-lock.json

  backend:
    build:
      context: .
    env_file:
      - .env
    environment:
      # El backend corre dentro de la red de Docker: usa el hostname interno del
      # servicio "postgres" en lugar del localhost:5433 que define .env para uso local.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      ia:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.local.nutria.com`)"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      # Documentación unificada de la API: mismo contenedor que el backend, otro
      # host. El redirect manda la raíz del dominio a /docs, así el host de
      # documentación no arranca con el 404 de una ruta de API inexistente.
      # Los escapes no son opcionales: \\. porque la label es un string de YAML,
      # y $$ porque Compose interpreta un $ suelto como interpolación.
      - "traefik.http.routers.swagger.rule=Host(`swagger.local.nutria.com`)"
      - "traefik.http.routers.swagger.service=backend"
      - "traefik.http.routers.swagger.middlewares=swagger-root"
      - "traefik.http.middlewares.swagger-root.redirectregex.regex=^http://swagger\\.local\\.nutria\\.com/?$$"
      - "traefik.http.middlewares.swagger-root.redirectregex.replacement=http://swagger.local.nutria.com/docs"
    # Solo aplica con `npm run dev`: un cambio en src/ se copia y reinicia el
    # contenedor (unos segundos, el CMD vuelve a correr migrate deploy). Un cambio
    # de schema o de dependencias rebuildea, porque hay que regenerar el cliente
    # de Prisma o reinstalar.
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  ia:
    build:
      context: ../nutria-ia
    env_file:
      - ../nutria-ia/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ia.rule=Host(`ia.local.nutria.com`)"
      - "traefik.http.services.ia.loadbalancer.server.port=8000"

  # pytest del servicio de IA (`npm run test:ia` desde la raíz). La etapa `test`
  # del Dockerfile suma requirements-dev.txt y tests/, que la imagen de `ia` no
  # lleva. `profiles` evita que levante con `up`.
  ia-test:
    build:
      context: ../nutria-ia
      target: test
    profiles: [tools]

  postgres:
    # Postgres estándar con la extensión pgvector disponible para cuando se
    # integre RAG. La extensión no se activa en este incremento.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - nutria_postgres_data:/var/lib/postgresql/data
    # Permite `up --wait postgres` y `depends_on: condition: service_healthy`:
    # sin esto, una migración o seed lanzados con la base recién arrancada fallan
    # con "Can't reach database server".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # pgAdmin 4 en modo escritorio (sin login ni contraseña maestra), con el servidor
  # del stack ya registrado. servers.json no interpola variables de entorno, así que
  # el entrypoint lo genera — junto con el pgpass — a partir de las mismas
  # credenciales de .env antes de arrancar pgAdmin. Sin volumen a propósito:
  # pgAdmin importa servers.json solo con su base interna vacía, y así lo reimporta
  # en cada arranque y queda siempre alineado con .env.
  pgadmin:
    image: dpage/pgadmin4:9
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Los exige el entrypoint de la imagen aunque en modo escritorio no se usen.
      # ".local" es un TLD "special-use" (RFC 6761): el validador de email de
      # pgAdmin lo rechaza aunque CHECK_EMAIL_DELIVERABILITY esté en False.
      PGADMIN_DEFAULT_EMAIL: dev@nutria.com
      PGADMIN_DEFAULT_PASSWORD: nutria
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '{"Servers":{"1":{"Name":"NutrIA (local)","Group":"Servers","Host":"postgres","Port":5432,"MaintenanceDB":"%s","Username":"%s","SSLMode":"prefer","PassFile":"/tmp/pgpass"}}}' "$$POSTGRES_DB" "$$POSTGRES_USER" > /tmp/servers.json
        printf 'postgres:5432:*:%s:%s\n' "$$POSTGRES_USER" "$$POSTGRES_PASSWORD" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        exec /entrypoint.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`db.local.nutria.com`)"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  # Cliente psql contra la base del stack (`npm run db:shell` desde la raíz).
  # `profiles` evita que levante con `up`.
  psql:
    image: pgvector/pgvector:pg16
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB}

volumes:
  nutria_postgres_data:
