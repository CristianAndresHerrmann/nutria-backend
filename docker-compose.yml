name: nutria

services:
  proxy:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    build:
      context: ../nutria-frontend
    env_file:
      - ../nutria-frontend/.env
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`local.nutria.com`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

  backend:
    build:
      context: .
    env_file:
      - .env
    environment:
      # El backend corre dentro de la red de Docker: usa el hostname interno del
      # servicio "postgres" en lugar del localhost:5433 que define .env para uso local.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      ia:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.local.nutria.com`)"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      # Documentación unificada de la API: mismo contenedor que el backend, otro
      # host. El redirect manda la raíz del dominio a /docs, así el host de
      # documentación no arranca con el 404 de una ruta de API inexistente.
      # Los escapes no son opcionales: \\. porque la label es un string de YAML,
      # y $$ porque Compose interpreta un $ suelto como interpolación.
      - "traefik.http.routers.swagger.rule=Host(`swagger.local.nutria.com`)"
      - "traefik.http.routers.swagger.service=backend"
      - "traefik.http.routers.swagger.middlewares=swagger-root"
      - "traefik.http.middlewares.swagger-root.redirectregex.regex=^http://swagger\\.local\\.nutria\\.com/?$$"
      - "traefik.http.middlewares.swagger-root.redirectregex.replacement=http://swagger.local.nutria.com/docs"

  ia:
    build:
      context: ../nutria-ia
    env_file:
      - ../nutria-ia/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ia.rule=Host(`ia.local.nutria.com`)"
      - "traefik.http.services.ia.loadbalancer.server.port=8000"

  postgres:
    # Postgres estándar con la extensión pgvector disponible para cuando se
    # integre RAG. La extensión no se activa en este incremento.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - nutria_postgres_data:/var/lib/postgresql/data
    # Permite `up --wait postgres` y `depends_on: condition: service_healthy`:
    # sin esto, una migración o seed lanzados con la base recién arrancada fallan
    # con "Can't reach database server".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Cliente psql contra la base del stack (`npm run db:shell` desde la raíz).
  # `profiles` evita que levante con `up`.
  psql:
    image: pgvector/pgvector:pg16
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB}

volumes:
  nutria_postgres_data:
